# =========================================================
# Workflow Screen - Navigation
# =========================================================

workflow.menu=xpath=//span[normalize-space()='Workflows']
workflow.page.title=xpath=//h1[normalize-space()='Workflows']


# =========================================================
# Workflow Card
# =========================================================

workflow.card=xpath=//a[contains(@href,'/workflows/') and not(contains(@href,'/design'))]/parent::*
workflow.link=xpath=(//a[contains(@href,'/workflows/') and not(contains(@href,'/design'))])[1]
workflow.name=xpath=.//p[normalize-space()!=''][1]
workflow.description=xpath=.//p[normalize-space()!=''][2]
workflow.metadata=xpath=.//p[normalize-space()!=''][3]


# =========================================================
# Workflow Status
# =========================================================

# test2 is the first Draft workflow
workflow.status=xpath=(//span[text()='Draft'])[1]


# =========================================================
# Workflow Actions - test2
# =========================================================

workflow.builder=xpath=.//a[contains(@href,'/design')]//span[normalize-space()='design_services']
workflow.settings=xpath=.//span[normalize-space()='settings']
workflow.edit=xpath=.//span[normalize-space()='edit']
workflow.duplicate=xpath=.//span[normalize-space()='content_copy']
workflow.delete=xpath=.//span[normalize-space()='delete']

workflow.search=xpath=//input[contains(@placeholder,'Search workflows by name or key')]

workflow.filter.all=xpath=//button[normalize-space()='All']
workflow.filter.draft=xpath=//button[normalize-space()='Draft']
workflow.filter.active=xpath=//button[normalize-space()='Active']
workflow.filter.archived=xpath=//button[normalize-space()='Archived']

workflow.category=xpath=//input[@placeholder='Filter by category']
workflow.category.apply=xpath=//button[normalize-space()='Apply']


# =========================================================
# Active Filters
# =========================================================

workflow.active.filters=xpath=//p[normalize-space()='Active filters:']
workflow.clear.filters=xpath=//p[normalize-space()='Active filters:']/ancestor::div[1]//button[.//span[normalize-space()='Clear'] or normalize-space()='Clear' or contains(normalize-space(.),'Clear')]
workflow.remove.filter=xpath=//button[@aria-label='Remove filter']
workflow.search.filter=xpath=//span[starts-with(normalize-space(),'Search:')]


# =========================================================
# Workflow Details
# =========================================================

workflow.details.title=xpath=//main//h1[1]

# =========================================================
# Flow 3 - Create Workflow from Starter
# =========================================================

workflow.create.from.starter=xpath=//button[text()='Create from starter']

workflow.template.store.printer.invoice=xpath=//p[normalize-space()='Store Printer Invoice Remediation']/ancestor::button[1]

workflow.next=xpath=//button[text()='Next']

workflow.key=xpath=//label[.//span[contains(normalize-space(),'Workflow key')]]/following::input[@type='text'][1]

workflow.skip.and.create=xpath=//button[normalize-space()='Skip & create']


# =========================================================
# Flow 3 - Configure Workflow
# =========================================================

workflow.configure.dialog=xpath=//div[@role='dialog']

workflow.risk.threshold=xpath=//div[@role='dialog']//input[@placeholder='0.85']

workflow.save.knobs=xpath=//div[@role='dialog']//button[normalize-space()='Save knobs']


# =========================================================
# Flow 3 - Verification
# =========================================================

workflow.created.title=xpath=//h1[normalize-space()='ITSM Store Printer Invoice Remediation']

workflow.created.status=xpath=//h1[normalize-space()='ITSM Store Printer Invoice Remediation']/following::span[normalize-space()='Draft'][1]

workflow.back.to.workflows=xpath=//a[@href='/workflows']

workflow.created.card=xpath=//a[contains(@href,'/workflows/') and not(contains(@href,'/design'))]/parent::*

workflow.created.card.name=xpath=.//p[normalize-space()='ITSM Store Printer Invoice Remediation']

workflow.created.card.status=xpath=.//span[translate(normalize-space(),'ABCDEFGHIJKLMNOPQRSTUVWXYZ','abcdefghijklmnopqrstuvwxyz')='draft']


# ============================================================
# FLOW 4 - WORKFLOW EXECUTION
# ============================================================

# Existing workflow
workflow.execution.card=xpath=(//a[starts-with(@href,'/workflows/')])[1]

# Open workflow builder
workflow.execution.openBuilder=xpath=//button[contains(normalize-space(.),'Open builder')]

# Queue configuration
workflow.execution.assignQueue=xpath=//button[contains(.,'Assign queue')]

workflow.execution.queueDropdown=xpath=//div[@role='dialog']//div[@role='combobox'][1]

workflow.execution.devQueue=xpath=//li[@role='option' and normalize-space()='dev-playground-queue (dev-playground-queue)']

workflow.execution.saveQueue=xpath=//div[@role='dialog']//button[contains(.,'Save')]

workflow.execution.queueDialog=xpath=//div[@role='dialog']

# Test draft workflow
workflow.execution.testDraftWorkflow=xpath=//button[@aria-label='Test draft workflow']

# JSON input
workflow.execution.inputData=xpath=//div[@role='dialog' and .//h2[normalize-space()='Test draft workflow']]//textarea[@rows='8' and not(@aria-hidden='true')]

# Test draft button
workflow.execution.testDraft=xpath=//div[@role='dialog' and .//h2[normalize-space()='Test draft workflow']]//button[contains(normalize-space(.),'Test draft')]

# Execution dialog
workflow.execution.executionDialog=xpath=//div[@role='dialog' and .//span[@aria-label='Workflow instance status (overall run state on the server).']]

# Workflow execution status
workflow.execution.workflowStatus=xpath=//div[@role='dialog' and .//span[@aria-label='Workflow instance status (overall run state on the server).']]//span[@aria-label='Workflow instance status (overall run state on the server).']//span

# Human task
workflow.execution.respondToTask=xpath=//div[@role='dialog']//button[normalize-space()='Respond to task']

# L2 Review
workflow.execution.l2Review=xpath=//div[@role='dialog']//p[normalize-space()='L2 Review']

# L2 Review human task description
workflow.execution.l2ReviewHumanTask=xpath=//div[@role='dialog']//p[normalize-space()='L2 Review']/../../p[contains(normalize-space(.),'Human task')]

# Submit
workflow.execution.submit=xpath=//button[normalize-space()='Submit']

# Live execution trace status
workflow.execution.traceStatus=xpath=//div[@role='dialog' and .//span[@aria-label='Workflow instance status (overall run state on the server).']]//div[@aria-label='Live stream progress for this viewer (connecting / currently running / finished streaming).']//span[normalize-space()]



# ============================================================
# FLOW 4 - WORKFLOW EXECUTION
# ============================================================

# ------------------------------------------------------------
# Scenario 1 - Workflows screen
# ------------------------------------------------------------

flow4.workflows.heading=xpath=//h1[normalize-space()='Workflows']


# ------------------------------------------------------------
# Scenario 2 - Store Printer Invoice Remediation
# ------------------------------------------------------------

flow4.workflow.card=xpath=//a[starts-with(@href,'/workflows/') and not(contains(@href,'/design')) and .//p[normalize-space()='ITSM Store Printer Invoice Remediation']]

flow4.workflow.heading=xpath=//h1[normalize-space()='ITSM Store Printer Invoice Remediation']


# ------------------------------------------------------------

# ------------------------------------------------------------

flow4.builder=xpath=//button[contains(normalize-space(.),'Open builder')]

flow4.test.draft.workflow.button=xpath=//button[@aria-label='Test draft workflow']


# ------------------------------------------------------------
# Scenario 4 - Test draft workflow dialog
# ------------------------------------------------------------

flow4.test.draft.workflow.dialog.heading=xpath=//h2[normalize-space()='Test draft workflow']


# ------------------------------------------------------------
# Scenario 5 - inputData JSON
# Confirmed locator from our Flow 4 work
# ------------------------------------------------------------
#flow4.input.data.json=xpath=(//textarea)[5]
flow4.input.data.json=xpath=//div[@role='dialog' and .//h2[normalize-space()='Test draft workflow']]//textarea[@rows='8' and not(@aria-hidden='true')]
flow4.test.draft.button=xpath=//div[@role='dialog' and .//h2[normalize-space()='Test draft workflow']]//button[contains(normalize-space(.),'Test draft')]
#flow4.trace.close.button=xpath=//button[@aria-label='Close']

# ------------------------------------------------------------
# Execution trace
# ------------------------------------------------------------

flow4.execution.trace=xpath=//h2[starts-with(normalize-space(),'WF-')]


# ------------------------------------------------------------
# Scenario 6 - Traces
# ------------------------------------------------------------

flow4.traces.heading=xpath=//p[normalize-space()='Traces']


# ------------------------------------------------------------
# Overall workflow execution status
# Actual status can change:
# Running / Waiting / Completed / Failed / etc.
# ------------------------------------------------------------

flow4.execution.overall.status=xpath=//span[@aria-label='Workflow instance status (overall run state on the server).']//span[contains(@class,'MuiChip-label')]


# ------------------------------------------------------------
# Individual trace statuses
# Reads actual status chips from trace panel.
# ------------------------------------------------------------

flow4.trace.statuses=xpath=//span[contains(@class,'MuiChip-label')][normalize-space()='Started' or normalize-space()='Completed' or normalize-space()='Waiting' or normalize-space()='Running' or normalize-space()='Failed' or normalize-space()='Cancelled' or normalize-space()='Skipped']
flow4.trace.close.button=xpath=//button[@aria-label='Close']
flow4.builder.back.button=xpath=//button[@aria-label='Back']
flow4.assign.queue=xpath=//button[contains(.,'Assign queue')]
flow4.queue.dropdown=xpath=//div[@role='dialog']//div[@role='combobox'][1]
flow4.dev.queue=xpath=//li[@role='option' and normalize-space()='dev-playground-queue (dev-playground-queue)']
flow4.save.queue=xpath=//div[@role='dialog']//button[contains(.,'Save')]
flow4.queue.dialog=xpath=//div[@role='dialog']
flow4.queue.heading=xpath=//div[@role='dialog']//h2[normalize-space()='Assign queue']